name: rpi-selfhosted-cicd

on:
  push:
    branches:
      - main
      - "stage/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: "20"
  ARCHIVE_NAME: pft-backend-release.tgz

jobs:
  self-hosted-deploy:
    name: Build, test, and deploy on Raspberry Pi 5 self-hosted runner
    runs-on: [self-hosted, linux, arm64]
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Create deployment archive
        run: |
          tar -czf "${{ runner.temp }}/${{ env.ARCHIVE_NAME }}" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='coverage' \
            --exclude='*.log' \
            .

      - name: Checkpoint: Verify artifacts
        run: |
          echo "Archive created: ${{ runner.temp }}/${{ env.ARCHIVE_NAME }}"
          ls -lh "${{ runner.temp }}/${{ env.ARCHIVE_NAME }}"

      - name: Pre-deploy checks and cleanup
        env:
          RPI_CONTAINER_NAME: ${{ secrets.RPI_CONTAINER_NAME }}
          RPI_APP_PORT: ${{ secrets.RPI_APP_PORT }}
        run: |
          set -euo pipefail
          CONTAINER="${RPI_CONTAINER_NAME:-pft-backend-app}"
          PORT="${RPI_APP_PORT:-4000}"
          echo "Pre-deploy: ensure ${PORT} is free and remove old container ${CONTAINER}"

          if docker ps -a --format '{{.Names}}' | grep -Fxq "$CONTAINER"; then
            echo "Removing existing container named $CONTAINER"
            docker rm -f "$CONTAINER" || true
          fi

          # Find any container binding the host port and remove it
          BINDING_CONTAINER_IDS=$(docker ps --format '{{.ID}} {{.Ports}}' | awk -v port=":${PORT}" '$0 ~ port {print $1}') || true
          if [ -n "${BINDING_CONTAINER_IDS:-}" ]; then
            echo "Found containers binding port ${PORT}: ${BINDING_CONTAINER_IDS}"
            echo "$BINDING_CONTAINER_IDS" | xargs -r docker rm -f || true
          fi

      - name: Optional: Run DB migrations
        if: ${{ secrets.PROD_DATABASE_URL }}
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          echo "Running Prisma migrations against PROD database"
          npm run prisma:migrate:deploy

      - name: Deploy locally on Raspberry Pi
        env:
          APP_DIR: ${{ secrets.RPI_APP_DIR }}
          RPI_CONTAINER_NAME: ${{ secrets.RPI_CONTAINER_NAME }}
          RPI_APP_PORT: ${{ secrets.RPI_APP_PORT }}
          RPI_ENV_FILE_CONTENT: ${{ secrets.RPI_ENV_FILE_CONTENT }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          mkdir -p /tmp
          cp "${{ runner.temp }}/${{ env.ARCHIVE_NAME }}" /tmp/
          APP_DIR="${APP_DIR:-/opt/pft-backend}" \
          RPI_CONTAINER_NAME="${RPI_CONTAINER_NAME:-pft-backend-app}" \
          RPI_APP_PORT="${RPI_APP_PORT:-4000}" \
          ARCHIVE_PATH="/tmp/${ARCHIVE_NAME}" \
          RELEASE_ID="${RELEASE_ID::12}" \
          RPI_ENV_FILE_CONTENT="${RPI_ENV_FILE_CONTENT:-}" \
          scripts/deploy-rpi.sh

      - name: Post-deploy health check
        env:
          RPI_CONTAINER_NAME: ${{ secrets.RPI_CONTAINER_NAME }}
          RPI_APP_PORT: ${{ secrets.RPI_APP_PORT }}
        run: |
          set -euo pipefail
          PORT="${RPI_APP_PORT:-4000}"
          CONTAINER="${RPI_CONTAINER_NAME:-pft-backend-app}"
          HEALTH_URL="http://127.0.0.1:${PORT}/health"
          echo "Waiting for health endpoint: ${HEALTH_URL}"
          ok=1
          for i in $(seq 1 6); do
            if curl -sf "${HEALTH_URL}" > /dev/null; then
              echo "Health check passed"
              ok=0
              break
            else
              echo "Attempt ${i}: not healthy yet"
              sleep 5
            fi
          done
          if [ "${ok}" -ne 0 ]; then
            echo "Health check failed; dumping last 200 container logs for ${CONTAINER}"
            docker logs --tail 200 "${CONTAINER}" || true
            exit 1
          fi
